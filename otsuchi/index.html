<style>
  :root{
    --forest:#2f4d3a;     /* 岩手の森 */
    --forest2:#3f6b4c;
    --rust:#b5652f;       /* 紅葉・鹿肉 */
    --gold:#c8902f;       /* BBQ・体験 */
    --hunt:#7a3030;       /* 狩猟・解体 */
    --stay:#7a6cae;       /* 宿 */
    --paper:#f6f3ec;
    --card:#ffffff;
    --ink:#1d2a2e;
    --muted:#56646a;
    --line:#e4ded2;
    --ok:#1f7a5a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{word-break:auto-phrase;line-break:strict;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--paper);color:var(--ink);
    line-height:1.6;-webkit-text-size-adjust:100%;
    padding-bottom:40px;
  }
  .wrap{max-width:560px;margin:0 auto;}

  header{
    background:linear-gradient(160deg,var(--forest),var(--forest2));
    color:#fff;padding:16px 16px 16px;padding-top:max(16px,env(safe-area-inset-top));
  }
  header .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.8;margin:0 0 4px;}
  header h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.01em;}
  header .dates{font-size:12.5px;opacity:.85;margin-top:4px;}

  .tabs{position:sticky;top:0;z-index:20;background:var(--forest);display:flex;overflow-x:auto;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-top:env(safe-area-inset-top,0);}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:12px 16px;color:#d8e6da;font-size:13px;font-weight:700;
    background:none;border:none;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit;}
  .tab small{display:block;font-size:10px;font-weight:600;opacity:.75;letter-spacing:.04em;}
  .tab.active{color:#fff;border-bottom-color:var(--gold);}

  main{padding:16px 16px 0;}
  .day{display:none;}
  .day.active{display:block;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .dayhead{margin:8px 0 16px;}
  .dayhead h2{margin:0;font-size:17px;font-weight:800;}
  .dayhead p{margin:4px 0 0;font-size:12.5px;color:var(--muted);}

  .note-flex{background:#fff7e8;border:1px solid #f0dca8;border-radius:16px;padding:12px 16px;
    font-size:12.5px;color:#7a5a17;margin:0 0 16px;}
  .note-flex b{color:var(--gold);}
  .note-flex.pending{background:#fdeeee;border-color:#eec3c3;color:#8a2f2f;}
  .note-flex.pending b{color:var(--hunt);}

  .item{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;margin:0 0 8px;position:relative;overflow:hidden;}
  .item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--forest);}
  .item.eat:before{background:var(--rust);}
  .item.tour:before{background:var(--gold);}
  .item.hunt:before{background:var(--hunt);}
  .item.stay:before{background:var(--stay);}
  .item.pending:before{background-image:repeating-linear-gradient(135deg,#c98a3a,#c98a3a 4px,#e9c98f 4px,#e9c98f 8px);}
  .item .top{display:flex;align-items:baseline;gap:8px;}
  .time{font-size:13px;font-weight:800;color:var(--forest);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:48px;}
  .item.eat .time{color:#9a5226;}
  .item.tour .time{color:#8a6418;}
  .item.hunt .time{color:var(--hunt);}
  .item.stay .time{color:var(--stay);}
  .ttl{font-size:14.5px;font-weight:700;}
  .cat{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;
    margin-bottom:4px;}
  .desc{font-size:12.5px;color:#4a575c;margin:8px 0 0;}
  .desc.warn{color:#9a3a2a;}
  .row{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;}
  a.pin,a.tel,a.link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;
    text-decoration:none;padding:4px 12px;border-radius:999px;border:1px solid var(--line);}
  a.pin{color:var(--forest);background:#eef5f0;border-color:#d3e6da;}
  a.tel{color:#2c6a3f;background:#eef6ef;border-color:#cfe6d4;}
  a.link{color:#7a4fae;background:#f3ecfa;border-color:#e2d5f0;}
  a.pin:active,a.tel:active,a.link:active{transform:scale(.97);}

  .pill{font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:999px;letter-spacing:.05em;}
  .pill.tour{background:#fbf0d8;color:#8a6418;}
  .pill.hunt{background:#f6dede;color:#7a3030;}

    text-transform:uppercase;font-weight:800;}
  .ref .item{padding:16px;}
  .ref .ttl{font-size:13.5px;}
  .kv{font-size:12.5px;color:#4a575c;margin-top:4px;}
  .kv b{color:var(--ink);}

  .check{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 16px;overflow:hidden;}
  .check h4{margin:0;padding:12px 16px;font-size:14px;font-weight:800;background:#f0ece1;
    display:flex;justify-content:space-between;align-items:center;}
  .check h4 .cnt{font-size:11px;color:var(--muted);font-weight:700;}
  .check ul{list-style:none;margin:0;padding:4px 0 8px;}
  .check li{padding:0;}
  .check label{display:flex;gap:12px;align-items:flex-start;padding:8px 16px;font-size:13.5px;cursor:pointer;}
  .check input{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:0 0 auto;margin-top:2px;
    border:2px solid #c7cdc9;border-radius:6px;position:relative;background:#fff;}
  .check input:checked{background:var(--ok);border-color:var(--ok);}
  .check input:checked:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
    border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);}
  .check input:checked + span{color:#9aa4a0;text-decoration:line-through;}
  .reset{display:block;margin:0 0 24px;width:100%;background:none;border:1px dashed var(--line);
    color:var(--muted);font-size:12px;font-weight:700;padding:8px;border-radius:16px;font-family:inherit;}
  .reset:active{background:#efece4;}

  footer{text-align:center;font-size:11px;color:var(--muted);padding:8px 16px 24px;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;}}
  #splash{position:fixed;inset:0;z-index:9000;background:#2a4531 url('hero.jpg') center top/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:13vh;transition:opacity .6s ease}
  #splash .st{background:rgba(14,30,20,.55);color:#fff;padding:8px 16px;border-radius:16px;text-align:center}
  #splash .st b{display:block;font-size:20px;letter-spacing:.08em;font-weight:800}
  #splash .st span{font-size:12px;opacity:.9;letter-spacing:.04em}
  #splash.hide{opacity:0;pointer-events:none}
</style>

    var cls='item '+(it.cls||'move');
    var pin = it.map ? '<a class="pin" target="_blank" rel="noopener" href="'+url(it.map.q)+'">🧭 '+it.map.pin+'</a>' : '';
    var tel = it.tel ? '<a class="tel" href="tel:'+it.tel.replace(/[^0-9]/g,'')+'">☎ '+it.tel+'</a>' : '';
    var lnk = it.link ? '<a class="link" target="_blank" rel="noopener" href="'+it.link+'">🎫 '+(it.linkLabel||'詳細ページ')+'</a>' : '';
    var row = (pin||tel||lnk) ? '<div class="row">'+lnk+pin+tel+'</div>' : '';
    var desc = it.desc ? '<p class="desc'+(it.cat==='要注意'?' warn':'')+'">'+it.desc+'</p>' : '';
    return '<div class="'+cls+'"><div class="cat">'+(it.cat||'')+'</div>'+
      '<div class="top"><div class="time">'+it.t+'</div><div class="ttl">'+it.ttl+'</div></div>'+
      desc+row+'</div>';
  }

  var tabs=document.getElementById('tabs'), main=document.getElementById('main');
  days.forEach(function(d,i){
    var btn=document.createElement('button');
    btn.className='tab'+(i===0?' active':'');
    btn.innerHTML=d.key+'<small>'+d.dow+'</small>';
    btn.onclick=function(){
      document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
      document.querySelectorAll('.day').forEach(function(s){s.classList.remove('active');});
      btn.classList.add('active');
      document.getElementById('day'+i).classList.add('active');
      window.scrollTo({top:0,behavior:'smooth'});
    };
    tabs.appendChild(btn);

    var sec=document.createElement('section');
    sec.className='day'+(i===0?' active':'');
    sec.id='day'+i;
    var html='<div class="dayhead"><h2>'+d.title+'</h2><p>'+d.sub+'</p></div>';
    if(d.block==='prep'){
      html+='<div class="lists"><h3>チェックリスト</h3><div id="lists"></div></div>';
      html+='<div class="ref"><h3>まとめ・確定事項</h3>'+ref.map(function(r){
        var pin=r.map?'<a class="pin" target="_blank" rel="noopener" href="'+url(r.map.q)+'">🧭 '+r.map.pin+'</a>':'';
        var tel=r.tel?'<a class="tel" href="tel:'+r.tel.replace(/[^0-9]/g,'')+'">☎ '+r.tel+'</a>':'';
        var lnk=r.link?'<a class="link" target="_blank" rel="noopener" href="'+r.link+'">🎫 '+(r.linkLabel||'詳細ページ')+'</a>':'';
        var rowsHtml=r.rows.map(function(x){return '<div class="kv">'+x+'</div>';}).join('');
        var foot=(pin||tel||lnk)?'<div class="row">'+lnk+pin+tel+'</div>':'';
        return '<div class="item"><div class="ttl">'+r.ttl+'</div>'+rowsHtml+foot+'</div>';
      }).join('')+'</div>';
    } else {
      if(d.key==='10/10'){
        html+='<div class="note-flex"><b>宿＝柿栗館（仮予約済）。</b>宿からの確定メール待ち。</div>';
      }
      html+=d.items.map(itemHTML).join('');
    }
    sec.innerHTML=html;
    main.appendChild(sec);
  });

  // ---- checklists with localStorage ----
  var KEY='otsuchi_gibier_checks_v1';
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
  function save(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
  var state=load();
  var host=document.getElementById('lists');
  if(host){
    lists.forEach(function(L){
      var box=document.createElement('div');box.className='check';
      var total=L.items.length, done=L.items.filter(function(_,j){return state[L.id+'_'+j];}).length;
      box.innerHTML='<h4>'+L.title+'<span class="cnt" id="cnt_'+L.id+'">'+done+' / '+total+'</span></h4>';
      var ul=document.createElement('ul');
      L.items.forEach(function(label,j){
        var id=L.id+'_'+j;
        var li=document.createElement('li');
        var checked=state[id]?'checked':'';
        li.innerHTML='<label><input type="checkbox" '+checked+' data-id="'+id+'"><span>'+label+'</span></label>';
        ul.appendChild(li);
      });
      box.appendChild(ul);
      host.appendChild(box);
      var rb=document.createElement('button');rb.className='reset';rb.textContent='「'+L.title+'」のチェックを全部外す';
      rb.onclick=function(){
        L.items.forEach(function(_,j){delete state[L.id+'_'+j];});
        save(state);
        box.querySelectorAll('input').forEach(function(c){c.checked=false;c.parentElement.querySelector('span').style.color='';});
        updateCnt(L);
      };
      host.appendChild(rb);
    });
    host.addEventListener('change',function(e){
      var c=e.target; if(c.type!=='checkbox')return;
      state[c.getAttribute('data-id')]=c.checked; save(state);
      var lid=c.getAttribute('data-id').split('_')[0];
      var L=lists.filter(function(x){return x.id===lid;})[0]; updateCnt(L);
    });
  }
  function updateCnt(L){
    var total=L.items.length, done=L.items.filter(function(_,j){return state[L.id+'_'+j];}).length;
    var el=document.getElementById('cnt_'+L.id); if(el)el.textContent=done+' / '+total;
  }
})();
</script>
</body>
</html>
