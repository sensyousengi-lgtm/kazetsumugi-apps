<style>
  :root{
    --mountain:#3f6f57;
    --mountain2:#56806a;
    --lake:#367589;
    --sky:#e89a65;
    --momiji:#c85a3f;
    --ginkgo:#d7a83f;
    --paper:#f7f3e9;
    --card:#fff;
    --ink:#22312c;
    --muted:#5d6a64;
    --line:#e4ddcf;
    --ok:#2f7658;
    --warn:#9d4738;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.65;-webkit-text-size-adjust:100%;padding-bottom:40px;
  }
  .wrap{max-width:560px;margin:0 auto}
  .nowrap{white-space:nowrap}
  header{background:linear-gradient(145deg,var(--mountain),var(--lake));color:#fff;padding:18px 18px 14px;padding-top:max(18px,env(safe-area-inset-top))}
  header .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.85;margin:0 0 4px}
  header h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.01em}
  header .dates{font-size:12.5px;opacity:.9;margin-top:3px}
  .tabs{position:sticky;top:0;z-index:20;background:var(--mountain);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-top:env(safe-area-inset-top,0)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:11px 14px;color:#d8e6df;font-size:13px;font-weight:700;background:none;border:0;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit;cursor:pointer}
  .tab small{display:block;font-size:10px;font-weight:600;opacity:.75;letter-spacing:.04em}
  .tab.active{color:#fff;border-bottom-color:var(--ginkgo)}
  main{padding:14px 14px 0}
  .day{display:none}
  .day.active{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .dayhead{margin:4px 2px 12px}
  .dayhead h2{margin:0;font-size:18px;font-weight:800}
  .dayhead p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
  .note{background:#fff8e8;border:1px solid #efdcae;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#725819;margin:0 2px 14px}
  .note strong{color:#795d15}
  .note.alert{background:#fff0ec;border-color:#edc9bf;color:#843d30}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin:0 2px 10px;position:relative;overflow:hidden}
  .item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mountain)}
  .item.move:before{background:var(--lake)}
  .item.eat:before{background:var(--momiji)}
  .item.see:before{background:var(--ginkgo)}
  .item.fly:before{background:var(--sky)}
  .item.stay:before{background:#7668a3}
  .item.warn:before{background:var(--warn)}
  .item .top{display:flex;align-items:baseline;gap:9px}
  .time{font-size:13px;font-weight:800;color:var(--mountain);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:58px}
  .item.move .time{color:var(--lake)}
  .item.eat .time{color:var(--momiji)}
  .item.see .time{color:#9a711b}
  .item.fly .time{color:#a95435}
  .ttl{font-size:14.5px;font-weight:750}
  .cat{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:1px}
  .desc{font-size:12.5px;color:#4d5b55;margin:5px 0 0}
  .desc.alert{color:var(--warn);font-weight:700}
  .row{margin-top:8px;display:flex;flex-wrap:wrap;gap:7px}
  a.pin,a.link{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;text-decoration:none;padding:5px 10px;border-radius:999px;border:1px solid var(--line)}
  a.pin{color:#285e70;background:#eef6f8;border-color:#d3e7ec}
  a.link{color:#665092;background:#f4eff9;border-color:#e1d8ec}
  a.pin:active,a.link:active{transform:scale(.97)}
  .section-title{font-size:13px;letter-spacing:.05em;color:var(--muted);margin:18px 4px 8px;font-weight:800}
  .branch{border:1px solid var(--line);border-radius:16px;background:#efeade;padding:11px 9px 3px;margin:0 2px 12px}
  .branch-title{display:flex;align-items:center;gap:8px;margin:0 3px 9px;font-size:13px;font-weight:800}
  .pill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.04em;background:#e2f0e8;color:#2f6947}
  .pill.fly{background:#fde9df;color:#945037}
  .choice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px}
  .choice h4{font-size:13.5px;margin:0;font-weight:800}
  .choice p{font-size:12.3px;color:#4d5b55;margin:5px 0 0}
  .choice .measure{color:#2b6575;font-weight:700}
  .choice .status{color:#8a6418;font-weight:700}
  .overview-grid{display:grid;gap:10px}
  .overview-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px}
  .overview-card h3{margin:0 0 7px;font-size:14px;display:flex;gap:8px;align-items:center}
  .overview-card h3 span{font-size:10.5px;color:#fff;background:var(--mountain);border-radius:999px;padding:3px 8px;white-space:nowrap}
  .overview-card p{margin:0;font-size:12.5px;color:#4d5b55}
  .overview-card .arrow{color:var(--lake);font-weight:800;padding:0 2px}
  .check{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 2px 12px;overflow:hidden}
  .check h3{margin:0;padding:12px 13px;font-size:14px;font-weight:800;background:#f0ece1;display:flex;justify-content:space-between;align-items:center}
  .check h3 .cnt{font-size:11px;color:var(--muted);font-weight:700}
  .check ul{list-style:none;margin:0;padding:4px 0 6px}
  .check label{display:flex;gap:11px;align-items:flex-start;padding:8px 13px;font-size:13.5px;cursor:pointer}
  .check input{appearance:none;-webkit-appearance:none;width:21px;height:21px;flex:0 0 auto;margin-top:1px;border:2px solid #c7cdc9;border-radius:6px;position:relative;background:#fff}
  .check input:checked{background:var(--ok);border-color:var(--ok)}
  .check input:checked:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
  .check input:checked + span{color:#929d98;text-decoration:line-through}
  .reset{display:block;margin:0 2px 24px;width:calc(100% - 4px);background:none;border:1px dashed var(--line);color:var(--muted);font-size:12px;font-weight:700;padding:9px;border-radius:12px;font-family:inherit;cursor:pointer}
  footer{text-align:center;font-size:11px;color:var(--muted);padding:8px 16px 24px}
  #splash{position:fixed;inset:0;z-index:9000;background:#ead9ba url('hero.jpg') center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 18px 13vh;transition:opacity .6s ease}
  #splash .st{background:rgba(42,79,61,.82);color:#fff;padding:11px 20px;border-radius:13px;text-align:center;box-shadow:0 8px 24px rgba(34,49,44,.22)}
  #splash .st b{display:block;font-size:20px;letter-spacing:.06em;font-weight:800}
  #splash .st span{font-size:12px;opacity:.92;letter-spacing:.03em}
  #splash.hide{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="wrap">

  <footer>車時間は2026年11月6日にGoogleマップで確認。<span class="nowrap">渋滞・駐車時間は含みません。</span><span class="nowrap">紅葉・飛行条件は当日の案内優先。</span></footer>

<script>
(function(){
  'use strict';
  const mapUrl=q=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q)+'&travelmode=driving';
  const pin=(label,q)=>'<a class="pin" href="'+mapUrl(q)+'" target="_blank" rel="noopener">📍 '+label+'</a>';
  const official=(label,url)=>'<a class="link" href="'+url+'" target="_blank" rel="noopener">↗ '+label+'</a>';
  const item=(t,cat,cls,ttl,desc,links='')=>`<article class="item ${cls}"><div class="cat">${cat}</div><div class="top"><span class="time">${t}</span><span class="ttl">${ttl}</span></div>${desc?`<p class="desc">${desc}</p>`:''}${links?`<div class="row">${links}</div>`:''}</article>`;

  const days=[
    {key:'全体',dow:'',title:'4日間の流れ',sub:'風で変わる午後だけを分岐。宿と帰路は固定。',html:`
      <div class="note"><strong>パラグライダーは11/8(日)・伐株山</strong><br>14:00から1人、15:00から1人。<span class="nowrap">1人最大1時間半。</span><span class="nowrap">11/7に飛ぶ連絡が来たら組み直します。</span></div>
      <div class="overview-grid">
        <article class="overview-card"><h3><span>11/6 金</span>成田前泊</h3><p>オンライン会議 <span class="arrow">→</span> 旅支度 <span class="arrow">→</span> 東横INN成田空港本館</p></article>
        <article class="overview-card"><h3><span>11/7 土</span>別府・鉄輪と紅葉</h3><p><strong>5:30起床・6:10のホテルバス。</strong>文福の後、別府地獄めぐりと鉄輪を2時間、<span class="nowrap">福貴野の滝を回って</span><span class="nowrap">16:38頃やまさ着。</span></p></article>
        <article class="overview-card"><h3><span>11/8 日</span>九重とパラグライダー</h3><p>朝食7:00・8:00発で朝一のタデ原・大吊橋・九酔渓、<span class="nowrap">九重町のフレンチで昼食、</span><span class="nowrap">14:00伐株山で飛ぶ、</span><span class="nowrap">17:15頃山城屋着。</span></p></article>
        <article class="overview-card"><h3><span>11/9 月</span>帰京と会議</h3><p>レンタカー返却 <span class="arrow">→</span> 大分空港 <span class="arrow">→</span> 成田12:10着 <span class="arrow">→</span> <span class="nowrap">最寄り駅14:10〜14:30着</span> <span class="arrow">→</span> <span class="nowrap">16:00オンライン会議</span></p></article>
      </div>`},
    {key:'11/6',dow:'金',title:'11/6(金)｜成田前泊',sub:'宿は予約済み。飛ぶのは11/8(日)で組んだ。',html:
      item('10:00–11:00','予定','move','オンライン会議','会議後に旅支度を進めます。')+
      item('20:30','確認','fly','パラグライダーは11/8(日)で組んだ','11/7に飛ぶ連絡は来ていない。場所は伐株山、14:00から1人・15:00から1人。')+
      item('夜','前泊','stay','東横INN成田空港本館','予約済み。明日の朝は6:10のバス（第3ターミナルに停まる最終）。早めに寝る。',pin('ホテルへ','東横INN成田空港本館')+official('ホテル公式','https://www.toyoko-inn.com/search/detail/00037/'))},
    {key:'11/7',dow:'土',title:'11/7(土)｜文福と別府・鉄輪',sub:'別府をたっぷり歩き、帰り道に紅葉へ。',html:
      `<div class="note"><strong>朝はこれだけ守る</strong><br>5:30起床 → <span class="nowrap">6:10のホテルバス</span>（第3ターミナルに停まる最終・余裕を持つなら5:50）。<span class="nowrap">手荷物と手続きの締切は7:30、</span><span class="nowrap">搭乗口は7:30まで。</span>ホテルの無料朝食は6:30からで間に合いません。</div>`+
      item('5:30','起床','warn','起きる','身支度とチェックアウトに40分。バスに乗っている時間は短い。早いのは、第3ターミナルに停まるバスが6:10で終わるため。')+
      item('6:10','バス','move','東横INNの送迎バスで第3ターミナルへ','第3ターミナルに停まるのは6:10発まで（4:20〜6:10の※便）。6:30以降の便は第3ターミナルに停まらない。',official('送迎バス時刻','https://www.toyoko-inn.com/campaign/pickup/narita/'))+
      item('7:30まで','締切','warn','手荷物・手続き・搭乗口','保安検査は7:00までに通る目安。搭乗締切は7:45。',official('ジェットスター公式','https://www.jetstar.com/jp/ja/help/when-do-i-need-to-get-to-the-airport'))+
      item('8:00–10:10','移動','move','成田から大分へ','到着後、送迎でレンタカー店へ向かいます。')+
      item('10:30','車','move','ニコニコレンタカーで受取','文福まで車56分・44.2km。',pin('レンタカー店へ','ニコニコレンタカー 大分空港武蔵町糸原店'))+
      item('11:30頃','昼食','eat','観光館 文福でがん汁','宇佐神宮近くの郷土料理。営業・席は当日確認します。',pin('文福へ','郷土料理のお店 観光館 文福')+official('文福公式','https://www.bunpuku.jp/'))+
      `<section class="branch"><h3 class="branch-title"><span class="pill">11/7側</span>紅葉候補の一覧</h3>
        <div class="choice"><h4>福貴野の滝</h4><p>見頃：10月下旬〜11月上旬｜車：御霊もみじから50分｜目安：30分</p><div class="row">${pin('福貴野の滝へ','福貴野の滝展望台')}${official('見頃の出典','https://www.visit-oita.jp/topics/detail/421')}</div></div>
        <div class="choice"><h4>深耶馬渓（一目八景）</h4><p class="status">10/28は色づき前。2025年の見頃目安は11/17中心の約1週間。</p><p>車：文福から48分｜目安：45〜60分</p><div class="row">${pin('一目八景へ','一目八景展望台')}${official('2026紅葉情報','https://nakatsuyaba.com/pages/512/')}${official('見頃の記録','https://nakatsuyaba.com/pages/485/')}</div></div>
        <div class="choice"><h4>御霊もみじ</h4><p class="status">10/28は色づき始め。2025年は外観が11/17中心、境内が12/1中心。</p><p>車：文福から38分｜目安：30〜45分</p><div class="row">${pin('御霊もみじへ','御霊もみじ')}${official('2026紅葉情報','https://nakatsuyaba.com/pages/512/')}${official('見頃の記録','https://nakatsuyaba.com/pages/485/')}</div></div>
        <div class="choice"><h4>溪石園</h4><p class="status">10/28は色づき始め。2025年の見頃目安は11/20中心の約1週間。</p><p>車：文福から42分｜目安：45〜60分</p><div class="row">${pin('溪石園へ','耶馬渓ダム記念公園 溪石園')}${official('2026紅葉情報','https://nakatsuyaba.com/pages/512/')}${official('見頃の記録','https://nakatsuyaba.com/pages/485/')}</div></div>
        <div class="choice"><h4>両子寺 <span class="status">早いかも</span></h4><p>例年は11月中旬〜下旬。現在は色づき始め（見頃前）のため、11/7・8は早い見込み。</p><p class="measure">車：文福から35分・両子寺からやまさ50分｜目安：45〜60分</p><div class="row">${pin('両子寺へ','両子寺')}${official('紅葉情報','https://tenki.jp/kouyou/9/47/30761.html')}${official('例年の見頃','https://visit-kunisaki.com/spot/%E4%B8%A1%E5%AD%90%E5%AF%BA/')}</div></div>
      </section>`+
      `<section class="branch"><h3 class="branch-title"><span class="pill">この日の流れ</span>おすすめの組み合わせ</h3><div class="choice"><h4>★ 文福 → 別府地獄めぐり・鉄輪 → 福貴野の滝 → やまさ</h4><p>11:30文福着・がん汁 → 12:30発 → 13:14海地獄着 → 13:15〜14:30海地獄・かまど地獄 → 14:30〜15:15鉄輪の温泉街 → 15:15発 → 15:54福貴野の滝着 → 15:55〜16:20展望台 → 16:20発 → 16:38やまさ着。</p><p>地獄めぐりは8:00〜17:00・年中無休。見どころ：コバルトブルーの海地獄、かまど地獄の噴気と多彩な池、鉄輪の湯けむり・地獄蒸し。</p><p class="measure">車合計1時間41分｜別府・鉄輪2時間｜やまさ16:38頃着｜16:30〜17:00宿入り ○</p><div class="row">${pin('海地獄へ','海地獄')}${pin('鉄輪へ','鉄輪温泉')}${pin('福貴野の滝へ','福貴野の滝展望台')}${official('地獄めぐり公式','https://www.beppu-jigoku.com/')}</div></div></section>`+
      item('16:30–17:00','宿','stay','<span class="nowrap">料亭やまさ旅館</span>','16:38頃着。チェックインの時に、明日の朝ご飯を7:00にしてもらう。',pin('やまさへ','料亭 やまさ旅館'))},
    {key:'11/8',dow:'日',title:'11/8(日)｜九重の朝とパラグライダー',sub:'朝一の山を見て、14:00に伐株山で飛ぶ。',html:
      `<div class="note"><strong>チェックインの時にもう一度頼む</strong><br>「朝ご飯を7:00にしてもらえますか。早く出たいです」<br>普段の朝食は8:00〜8:30（11/6の電話で聞いた）。ずらせなければ8:40頃に出て、タデ原を30分に縮める（伐株山13:45頃着は変わらない）。</div>`+
      item('7:00','朝食','eat','朝ご飯','いつもより1時間早めてもらう。')+
      item('8:00','出発','move','<span class="nowrap">料亭やまさ旅館</span>を出発','朝一の山を見に。タデ原湿原まで車1時間5分・64.2km。')+
      `<section class="branch"><h3 class="branch-title"><span class="pill">11/8側</span>紅葉候補の一覧</h3>
        <div class="choice"><h4>タデ原湿原</h4><p>11/3時点：長者原周辺の山麓は週末に見頃見込み｜車：やまさから1時間5分｜目安：40〜60分</p><div class="row">${pin('タデ原へ','タデ原湿原')}${official('11/3の状況','https://tosonline.jp/news/20261103/00000005.html')}${official('散策案内','https://www.env.go.jp/nature/nationalparks/list/aso-kuju/course/01/')}</div></div>
        <div class="choice"><h4>九重“夢”大吊橋</h4><p>橋から望む九酔渓は11月上旬が見頃｜車：タデ原から12分｜目安：45〜60分</p><div class="row">${pin('大吊橋へ','九重夢大吊橋')}${official('大吊橋公式','https://www.yumeooturihashi.com/')}${official('見頃の出典','https://www.visit-oita.jp/spots/detail/4738')}</div></div>
        <div class="choice"><h4>九酔渓</h4><p>見頃：11月上旬｜車：タデ原から15分｜目安：20〜30分</p><div class="row">${pin('九酔渓へ','九酔渓 桂茶屋')}${official('見頃の出典','https://www.visit-oita.jp/spots/detail/4738')}</div></div>
      </section>`+
      `<section class="branch"><h3 class="branch-title"><span class="pill fly">この日の流れ</span>おすすめの組み合わせ</h3><div class="choice"><h4>★ やまさ → タデ原 → 九重“夢”大吊橋 → 九酔渓 → ル・ラパンで昼 → 伐株山 → 山城屋</h4><p>8:00やまさ発 → 9:05タデ原着・朝の山を見て散策 → 10:00発 → 10:12大吊橋着・見学 → 11:00発 → 九酔渓・桂茶屋（谷の紅葉を車で走りながら見る）→ 11:45発 → 12:00ル・ラパンで昼のコース → 13:25発 → 13:45頃伐株山着（早く着いても待つだけ＝15分の余裕）→ 14:00から1人・15:00から1人（1人最大1時間半）→ 16:30頃終わる → 山城屋へ → 17:15頃着。</p><p>ル・ラパンは九重町の小さなフレンチ（口コミ4.7）。昼は12:00〜14:30・月曜休み。前菜・原木しいたけのスープ・肉・デザートのコース。九酔渓から伐株山への通り道。</p><p class="measure">車：九酔渓→ル・ラパン→伐株山 合計28分・伐株山→山城屋43分（高速）｜山城屋17:15頃着</p><div class="row">${pin('タデ原へ','タデ原湿原')}${pin('大吊橋へ','九重夢大吊橋')}${pin('ル・ラパンへ','ル・ラパン 九重町野上')}${pin('伐株山へ','伐株山 大分県玖珠郡玖珠町山田')}${official('ル・ラパン公式','https://lelapin-kokonoe.com/')}</div></div></section>`+
      item('12:00','昼食','eat','ル・ラパン（フレンチ）','昼のコース。席を取るなら電話 0973-77-6633。13:25に出る。',pin('ル・ラパンへ','ル・ラパン 九重町野上')+official('ル・ラパン公式','https://lelapin-kokonoe.com/'))+
      item('13:45頃','到着','fly','伐株山に着く','早く着いても待つだけなので、15分前で十分。14:00から1人、15:00から1人。1人最大1時間半で、16:30頃終わる。',pin('伐株山へ','伐株山 大分県玖珠郡玖珠町山田'))+
      item('17:15頃','宿','stay','旅館 山城屋','伐株山から車43分（高速）・下道なら49分。',pin('山城屋へ','旅館 山城屋 湯平'))},
    {key:'11/9',dow:'月',title:'11/9(月)｜帰京・オンライン会議',sub:'返却を早めに終え、16時の会議へ。',html:
      `<div class="note"><strong>16:00のオンライン会議</strong><br>預けなし＝12:22発 → <span class="nowrap">最寄り駅14:10着</span>（会議の110分前）。<br>預けあり＝12:42発 → <span class="nowrap">最寄り駅14:30着</span>（会議の90分前）。</div>`+
      item('日の出後','散策','see','任意：湯平石畳を10〜15分','朝食と出発に支障がない場合だけ。')+
      item('7:30–7:50','出発','move','山城屋を出発','朝食・給油・道路状況を見て確定します。')+
      item('9:00目標','返却','move','レンタカー返却','10:00の返却枠を安全到着時刻にはしません。')+
      item('10:35–12:10','移動','move','大分から成田へ','荷物を預けなければ、着いてすぐ出られます。')+
      item('12:22 / 12:42','帰宅','move','成田空港から最寄り駅へ','スカイライナー → 日暮里 → 山手線 → 新宿 → 小田急 → 新百合ヶ丘で各停。預けなし12:22発→14:10着／預けあり12:42発→14:30着（Googleマップ 11/6実測）。')+

        <li><label><input type="checkbox" data-group="nature" data-id="warm"><span>防寒着・雨具</span></label></li>

  ];

  const tabs=document.getElementById('tabs');
  const main=document.getElementById('main');
  days.forEach((d,i)=>{
    const id='day-'+i;
    const b=document.createElement('button');
    b.className='tab'+(i===0?' active':'');b.type='button';b.role='tab';b.id='tab-'+i;b.setAttribute('aria-controls',id);b.setAttribute('aria-selected',i===0?'true':'false');
    b.innerHTML=d.key+(d.dow?`<small>${d.dow}</small>`:'');tabs.appendChild(b);
    const s=document.createElement('section');s.className='day'+(i===0?' active':'');s.id=id;s.role='tabpanel';s.setAttribute('aria-labelledby',b.id);
    s.innerHTML=`<div class="dayhead"><h2>${d.title}</h2><p>${d.sub}</p></div>${d.html}`;main.appendChild(s);
    b.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')});
      document.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');b.setAttribute('aria-selected','true');s.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});
    });
  });

  const splash=document.getElementById('splash');
  const hideSplash=()=>splash.classList.add('hide');
  splash.addEventListener('click',hideSplash);
  setTimeout(hideSplash,1800);
  setTimeout(()=>{splash.style.display='none'},2500);

  const key='oita-trip-checks-v5';
  let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(_){saved={}}
  const boxes=[...document.querySelectorAll('.check input')];
  const update=()=>{
    boxes.forEach(x=>x.checked=!!saved[x.dataset.id]);
    document.querySelectorAll('[data-count]').forEach(el=>{
      const group=el.dataset.count;const xs=boxes.filter(x=>x.dataset.group===group);el.textContent=`${xs.filter(x=>x.checked).length}/${xs.length}`;
    });
  };
  boxes.forEach(x=>x.addEventListener('change',()=>{saved[x.dataset.id]=x.checked;try{localStorage.setItem(key,JSON.stringify(saved))}catch(_){}update()}));
  const reset=document.getElementById('reset');if(reset)reset.addEventListener('click',()=>{saved={};try{localStorage.removeItem(key)}catch(_){}update()});
  update();
})();
</script>
